name: Branch Merge Notifications

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{
              \"text\": \"✅ Branch merged into main\nRepository: ${{ github.repository }}\nPR: #${{ github.event.pull_request.number }}\nTitle: ${{ github.event.pull_request.title }}\nMerged by: ${{ github.event.pull_request.merged_by.login }}\nSource branch: ${{ github.event.pull_request.head.ref }}\"
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Email notification
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STAKEHOLDER_EMAILS: ${{ secrets.STAKEHOLDER_EMAILS }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()

          msg["Subject"] = "GitHub: Branch merged into main"
          msg["From"] = os.environ["SMTP_USERNAME"]
          msg["To"] = os.environ["STAKEHOLDER_EMAILS"]

          msg.set_content(f"""
          A branch has been merged into main.

          Repository: {os.environ["REPOSITORY"]}
          PR: #{os.environ["PR_NUMBER"]}
          Title: {os.environ["PR_TITLE"]}
          Source branch: {os.environ["SOURCE_BRANCH"]}
          Merged by: {os.environ["MERGED_BY"]}
          """)

          with smtplib.SMTP(
              os.environ["SMTP_HOST"],
              int(os.environ["SMTP_PORT"])
          ) as smtp:
              smtp.starttls()
              smtp.login(
                  os.environ["SMTP_USERNAME"],
                  os.environ["SMTP_PASSWORD"]
              )
              smtp.send_message(msg)

          print("Email notification sent successfully.")
          PY
