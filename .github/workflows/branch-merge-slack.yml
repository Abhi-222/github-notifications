name: Branch Merge Notifications

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{
              \"text\": \"✅ Branch merged into main\nRepository: ${{ github.repository }}\nPR: #${{ github.event.pull_request.number }}\nTitle: ${{ github.event.pull_request.title }}\nMerged by: ${{ github.event.pull_request.merged_by.login }}\nSource branch: ${{ github.event.pull_request.head.ref }}\"
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Email notification
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STAKEHOLDER_EMAILS: ${{ secrets.STAKEHOLDER_EMAILS }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          sender = os.environ["SMTP_USERNAME"]

          recipients = [
              email.strip()
              for email in os.environ["STAKEHOLDER_EMAILS"].split(",")
              if email.strip()
          ]

          msg = EmailMessage()
          msg["Subject"] = "GitHub Merge Notification - main"
          msg["From"] = sender
          msg["To"] = ", ".join(recipients)

          body = f"""
          GitHub Branch Merge Notification

          A branch has been successfully merged into the main branch.

          Repository: {os.environ["REPOSITORY"]}
          Pull Request: #{os.environ["PR_NUMBER"]}
          PR Title: {os.environ["PR_TITLE"]}
          Source Branch: {os.environ["SOURCE_BRANCH"]}
          Merged By: {os.environ["MERGED_BY"]}

          This notification was generated automatically by GitHub Actions.
          """

          msg.set_content(body)

          print("Sender:", sender)
          print("Recipients:", recipients)
          print("Connecting to SMTP server...")

          with smtplib.SMTP(
              os.environ["SMTP_HOST"],
              int(os.environ["SMTP_PORT"])
          ) as smtp:
              smtp.starttls()
              smtp.login(
                  sender,
                  os.environ["SMTP_PASSWORD"]
              )

              print("SMTP authentication successful.")

              result = smtp.send_message(msg)

              print("SMTP send result:", result)
              print("Email notification sent successfully.")
          PY


